<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404TEAM REDIRECTOR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>
        *{
            padding: 0px;
            margin: 0px;
        }

        body{
            background-color: #181818;
            color: white;
            text-shadow: 0px 0px 10px rgb(255,255,255);
            overflow: hidden;
        }

        .card{
            background-color: #1F1F1F;
            position: absolute;
            width: 400px;
            height: 60px;
            border: 0px solid;
            border-radius: 10px;
            left: calc(50vw - 200px);
            top: calc(50vh - 30px);
            box-shadow: 0px 0px 4px rgb(121, 121, 121);
            animation: loading 1s ease-in-out 1;
            animation-fill-mode: forwards;
            opacity: 0;
            overflow: hidden;
        }

        @keyframes loading{
            0%{
                opacity: 0;
                top: calc(50vh - 30px);
                height: 60px;
            }
            25%{
                opacity: 1;
            }
            100%{
                opacity: 1;
                top: calc(50vh - 225px);
                height: 450px;
            }
        }

        .title{
            width: 100%;
            text-align: center;
            margin-top: 20px;
            letter-spacing: 10px;
            font-family: Montserrat;
        }

        p{
            font-size: 10px;
        }

        .loadingbar{
            position: absolute;
            width: 0vw;
            height: 5px;
            background-color: white;
            bottom: 0px;
            left: 0px;
            animation: loadingbar 10s linear 1;
            animation-direction: forwards;
        }

        button{
            position: relative;
            width: 80%;
            margin-left: 10%;
            margin-top: 10px;
            height: 50px;
            font-family: Montserrat;
            font-size: 24px;
            cursor: pointer;
            background-color: rgb(231, 231, 231);
            border: 0px solid;
            border-radius: 5px;
            transition: .2s;
        }
        button:hover{
            transition: .2s;
            transform: scale(1.05);
        }

        @keyframes loadingbar {
            0%{
                width: 0vw;
            }
            100% {
                width: 100vw;
            }
        }

        .buttons{
            margin-top: 10px;
        }

        .disabled {
            background-color: rgb(78, 78, 78);
            color: rgb(172, 171, 171);
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2 class="title">404TEAM <p>redirector</p></h2>
        <div class="buttons">
            <a href="https://t.me/NotFoundTeams"><button>NotAFrizik Telegram</button></a>
            <a href="https://t.me/TheSashk1n"><button>TheSashkin Telegram</button></a>
            <a href="https://www.youtube.com/@NotAFrizik"><button>NotAFrizik YouTube</button></a>
            <a href="https://www.youtube.com/@TheSashkin"><button>TheSashkin YouTube</button></a>
            <a href="https://www.youtube.com/@alexmotu_"><button>alexmotu YouTube</button></a>
            <button class="disabled">404TEAM (W.I.P.)</button>
        </div>
    </div>
    <div class="loadingbar"></div>
    <script>
        setTimeout(() => {
        const links = Array.from(document.querySelectorAll('a[href]'))
            .map(a => a.href)
            .filter(href => {
                const trimmed = href.trim();
                return trimmed !== '' && 
                       !trimmed.startsWith('#') && 
                       !trimmed.startsWith('javascript:');
            });

        if (links.length > 0) {
            const randomIndex = Math.floor(Math.random() * links.length);
            const randomHref = links[randomIndex];
            window.location.href = randomHref;
        }
    }, 10000);
    </script>
</body>
</html>
